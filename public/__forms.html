<!DOCTYPE html>
<html>
  <body>
    <!-- Exists only so Netlify registers these forms at build time. Never shown to visitors. -->
    <form name="newsletter" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="newsletter" />
      <input type="email" name="email" />
      <input name="bot-field" />
    </form>
    <form name="inquiry" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="inquiry" />
      <input type="text" name="fullName" />
      <input type="email" name="email" />
      <input type="tel" name="whatsapp" />
      <input type="date" name="travelDate" />
      <input type="number" name="travelers" />
      <input type="text" name="preferredTour" />
      <textarea name="message"></textarea>
      <textarea name="savedItinerary"></textarea>
      <input name="bot-field" />
    </form>
  </body>
</html>
